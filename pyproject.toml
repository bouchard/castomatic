[project]
name = "castomatic"
version = "0.2.0"
description = "Cast anything anywhere: play a file, URL or web video on any TV over Chromecast, DLNA, Roku or AirPlay 2, converting only when needed"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brady Bouchard" }]
requires-python = ">=3.11"
dependencies = [
    "pyatv>=0.16",
    "srptools<2",
    "aiohttp",
    "ifaddr",
    "yt-dlp",
    "catt>=0.13",
    "rokuecp>=0.19",
]

[project.urls]
Homepage = "https://github.com/bouchard/castomatic"
Issues = "https://github.com/bouchard/castomatic/issues"

[project.scripts]
castomatic = "castomatic.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["castomatic"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-cov"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["castomatic"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
